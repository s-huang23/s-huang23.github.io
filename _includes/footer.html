<footer class="site-footer">
  <div class="wrap">
    <div class="contact-links">
      {% if site.author.email %}<a href="mailto:{{ site.author.email }}">Email</a>{% endif %}
      {% if site.author.github %}<a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>{% endif %}
      {% if site.author.linkedin %}<a href="https://www.linkedin.com/in/{{ site.author.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>{% endif %}
    </div>
    <p class="copyright">&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}</p>
  </div>
</footer>
